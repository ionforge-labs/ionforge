name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run ty check

      - name: Test
        run: uv run pytest

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --with packaging python - <<'PY'
          import os, sys, tomllib
          from packaging.version import Version

          raw_tag = os.environ["RELEASE_TAG"]
          tag = raw_tag[1:] if raw_tag.startswith("v") else raw_tag

          with open("pyproject.toml", "rb") as fh:
              raw_pkg = tomllib.load(fh)["project"]["version"]

          tag_version = Version(tag)
          pkg_version = Version(raw_pkg)

          print(f"Release tag: {raw_tag} -> normalized {tag_version}")
          print(f"pyproject.toml version: {raw_pkg} -> normalized {pkg_version}")

          if tag_version != pkg_version:
              print(
                  f"::error::Release tag ({tag_version}) does not match "
                  f"pyproject.toml version ({pkg_version})"
              )
              sys.exit(1)
          PY

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true
